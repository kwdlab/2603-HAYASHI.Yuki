connections {
  host-to-host {
    version = 2
    proposals = aes128gcm16-prfsha256-x25519
    local_addrs  = fd00::2
    remote_addrs = fd00::3
   

    local  {
      auth = pubkey
      certs = serverCert.pem
      id = "C=JP, O=Cyber, CN=server"
    }
    remote {
      auth = pubkey
      id = "C=JP, O=Cyber, CN=client"
    }

    children {
      host-to-host {
        mode = transport
        esp_proposals = null
        local_ts  = fd00::2/128
        remote_ts = fd00::3/128
      }
    }
  }
}
