connections {
  host-to-host {
    version = 2
    proposals = aes128gcm16-prfsha256-x25519
    local_addrs  = 10.0.0.3
    remote_addrs = 10.0.0.2

    local  {
      auth = pubkey
      certs = clientCert.pem
      id = "C=JP, O=Cyber, CN=client"
    }
    remote {
      auth = pubkey
      id = "C=JP, O=Cyber, CN=server"
    }

    children {
      host-to-host {
        mode = transport
        esp_proposals = aes128gcm16-x25519
        local_ts  = 10.0.0.3/32
        remote_ts = 10.0.0.2/32
      }
    }
  }
}
