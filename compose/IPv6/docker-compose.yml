services:
  vpn-server:
    image: strongx509/strongswan:latest
    container_name: vpn-server
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
    stdin_open: true
    tty: true
    volumes:
      - <HOST_SERVER_CONFIG_DIR>:/etc/swanctl
      - <HOST_STRONGSWAN_CONF>:/etc/strongswan.conf
    networks:
      vpn-net:
        ipv6_address: <SERVER_IPV6_ADDRESS>

  vpn-client:
    image: strongx509/strongswan:latest
    container_name: vpn-client
    depends_on:
      - vpn-server
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
    stdin_open: true
    tty: true
    volumes:
      - <HOST_CLIENT_CONFIG_DIR>:/etc/swanctl
      - <HOST_STRONGSWAN_CONF>:/etc/strongswan.conf
    networks:
      vpn-net:
        ipv6_address: <CLIENT_IPV6_ADDRESS>

networks:
  vpn-net:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: <IPV6_SUBNET_CIDR>
